<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1° Mes Aniversario</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #5a2a5a;
    text-align: center;
}

header {
    background: #f4c2c2;
    padding: 20px;
    font-size: 2em;
}

.container {
    padding: 20px;
}

/* INSTAGRAM STYLE */
.instagram {
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
}

.slider {
    display: flex;
    gap: 15px;
    padding: 20px;
}

.card {
    position: relative;
}

.card img {
    height: 300px;
    border-radius: 15px;
    scroll-snap-align: center;
    cursor: pointer;
    transition: transform 0.3s;
}

.card img:hover {
    transform: scale(1.05);
}

/* MENSAJE SECRETO */
.mensaje {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: rgba(255,192,203,0.9);
    padding: 10px;
    border-radius: 10px;
    font-size: 0.9em;
    display: none;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.modal img {
    max-width: 90%;
    max-height: 70%;
    border-radius: 20px;
}

.modal p {
    color: white;
    margin-top: 15px;
    max-width: 80%;
}

/* BOTONES */
button {
    background: #d8bfd8;
    border: none;
    padding: 15px;
    cursor: pointer;
    border-radius: 10px;
    margin: 10px;
}

#contador {
    margin-top: 20px;
    font-size: 1.3em;
}

/* CORAZONES */
.corazon {
    position: fixed;
    color: pink;
    animation: flotar 5s linear infinite;
}

@keyframes flotar {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<header>Para Mi Amor 💖</header>

<div class="container">
    <h2>Te amo muchísimo 💕</h2>
    <p>Nuestros momentos, como señales… siempre conectados 💫</p>

    <!-- CARRUSEL -->
    <div class="instagram">
        <div class="slider">

            <!-- TARJETAS -->
            <div class="card">
                <img src="foto1.jpg" onclick="abrirModal(this, mensajes[0])">
            </div>

            <div class="card">
                <img src="foto2.jpg" onclick="abrirModal(this, mensajes[1])">
            </div>

            <div class="card">
                <img src="foto4.jpg" onclick="abrirModal(this, mensajes[2])">
            </div>

            <div class="card">
                <img src="foto5.jpg" onclick="abrirModal(this, mensajes[3])">
            </div>

            <div class="card">
                <img src="foto6.jpg" onclick="abrirModal(this, mensajes[4])">
            </div>

            <div class="card">
                <img src="foto7.jpg" onclick="abrirModal(this, mensajes[5])">
            </div>

            <div class="card">
                <img src="foto8.jpg" onclick="abrirModal(this, mensajes[6])">
            </div>

            <div class="card">
                <img src="foto9.jpg" onclick="abrirModal(this, mensajes[7])">
            </div>

            <div class="card">
                <img src="foto10.jpg" onclick="abrirModal(this, mensajes[8])">
            </div>

            <div class="card">
                <img src="foto11.jpg" onclick="abrirModal(this, mensajes[9])">
            </div>

            <div class="card">
                <img src="foto12.jpg" onclick="abrirModal(this, mensajes[10])">
            </div>

        </div>
    </div>

    <div id="contador"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
    <img id="imgGrande">
    <p id="texto"></p>
</div>

<script>
// MENSAJES TELECOM 💖
const mensajes = [
"Desde que conectamos, nuestra señal nunca ha tenido interferencias ❤️",
"Eres mi frecuencia favorita, siempre en perfecta sincronización 📡",
"Nuestro amor es como fibra óptica… rápido, fuerte e infinito 💕",
"Tengo la mejor cobertura en cualquier lugar porque mi lugar seguro siempre eres tu. Ya tenemos la casa deseada y las ganas; ahora llenaremos esta casa de recuerdos. ❤️🏠",
"Eres el enlace perfecto en mi red de vida 💖",
"Aquel 2025 aprendimos que todo se puede caer, menos lo que empezamos a sentir. Hoy celebramos un mes de ser nuestra propia paz en medio del caos. TE AMO AIDA 💓",
"Un mes de ser tu almohada favorita y el guardián de tus sueños. No pido nada más. ✨ ❤️",
"Nuestro amor tiene más alcance que cualquier antena 📶",
"A veces me pierdo viendo hacia el futuro... y en cada rincón de lo que imagino, siempre estás TU AIDA.💕",
"Si esto es una red… tú eres mi nodo principal 💖",
"Contigo tengo conexión ilimitada para siempre ♾️"
];

// MODAL
function abrirModal(img, texto) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("imgGrande").src = img.src;
    document.getElementById("texto").innerText = texto;
}

function cerrarModal() {
    document.getElementById("modal").style.display = "none";
}

// CONTADOR
function actualizarContador() {
    const inicio = new Date("2026-02-20T12:00:00");
    const ahora = new Date();
    const diff = ahora - inicio;

    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diff / (1000 * 60)) % 60);

    document.getElementById("contador").innerText =
        `Llevamos ${dias} días, ${horas} horas y ${minutos} minutos juntos ❤️`;
}

setInterval(actualizarContador, 1000);

// CORAZONES
function crearCorazon() {
    const corazon = document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML = "💖";
    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.fontSize = Math.random() * 20 + 10 + "px";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 5000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
